version: 2

models:
  - name: stg_orders
    description: "Staging table for orders - one record per order"
    columns:
      - name: order_id
        description: "Unique identifier for the order"
        tests:
          - unique
          - not_null
      - name: customer_id
        description: "Foreign key to customers"
        tests:
          - not_null
          - relationships:
              to: ref('stg_customers')
              field: customer_id
      - name: order_status
        description: "Current status of the order"
        tests:
          - not_null
          - accepted_values:
              values: ['delivered', 'shipped', 'canceled', 'unavailable', 'invoiced', 'processing', 'created', 'approved']
      - name: order_purchase_timestamp
        description: "When the order was purchased"
        tests:
          - not_null
      - name: order_approved_at
        description: "When the order payment was approved"
      - name: order_delivered_carrier_date
        description: "When the order was handed to the carrier"
      - name: order_delivered_customer_date
        description: "When the order was delivered to customer"
      - name: order_estimated_delivery_date
        description: "Estimated delivery date shown to customer"

  - name: stg_customers
    description: "Staging table for customers - one record per customer"
    columns:
      - name: customer_id
        description: "Unique identifier for the customer in this dataset"
        tests:
          - unique
          - not_null
      - name: customer_unique_id
        description: "Unique identifier for the customer across all datasets"
        tests:
          - not_null
      - name: zip_code
        description: "First 5 digits of customer zip code"
        tests:
          - not_null
      - name: city
        description: "Customer city name"
        tests:
          - not_null
      - name: state
        description: "Customer state (2-letter code)"
        tests:
          - not_null

  - name: stg_order_items
    description: "Staging table for order items - one record per item in an order"
    columns:
      - name: order_id
        description: "Foreign key to orders"
        tests:
          - not_null
          - relationships:
              to: ref('stg_orders')
              field: order_id
      - name: order_item_id
        description: "Sequential number identifying the item within the order"
        tests:
          - not_null
      - name: product_id
        description: "Foreign key to products"
        tests:
          - not_null
          - relationships:
              to: ref('stg_products')
              field: product_id
      - name: seller_id
        description: "Foreign key to sellers"
        tests:
          - not_null
          - relationships:
              to: ref('stg_sellers')
              field: seller_id
      - name: shipping_limit_date
        description: "Shipping deadline for seller"
        tests:
          - not_null
      - name: price
        description: "Item price in BRL"
        tests:
          - not_null
      - name: freight_value
        description: "Freight value for this item in BRL"
        tests:
          - not_null

  - name: stg_products
    description: "Staging table for products - one record per product"
    columns:
      - name: product_id
        description: "Unique identifier for the product"
        tests:
          - unique
          - not_null
      - name: category_name
        description: "Product category name in Portuguese"
      - name: name_length
        description: "Number of characters in product name"
      - name: description_length
        description: "Number of characters in product description"
      - name: photos_qty
        description: "Number of product photos"
      - name: weight_g
        description: "Product weight in grams"
      - name: length_cm
        description: "Product length in centimeters"
      - name: height_cm
        description: "Product height in centimeters"
      - name: width_cm
        description: "Product width in centimeters"

  - name: stg_payments
    description: "Staging table for payments - one record per payment method per order"
    columns:
      - name: order_id
        description: "Foreign key to orders"
        tests:
          - not_null
          - relationships:
              to: ref('stg_orders')
              field: order_id
      - name: payment_sequential
        description: "Sequential number for when customer used multiple payment methods"
        tests:
          - not_null
      - name: payment_type
        description: "Payment method type"
        tests:
          - not_null
          - accepted_values:
              values: ['credit_card', 'boleto', 'voucher', 'debit_card', 'not_defined']
      - name: payment_installments
        description: "Number of installments chosen by customer"
        tests:
          - not_null
      - name: payment_value
        description: "Payment value in BRL"
        tests:
          - not_null

  - name: stg_reviews
    description: "Staging table for reviews - one record per review"
    columns:
      - name: review_id
        description: "Unique identifier for the review"
        tests:
          - unique
          - not_null
      - name: order_id
        description: "Foreign key to orders"
        tests:
          - not_null
          - relationships:
              to: ref('stg_orders')
              field: order_id
      - name: review_score
        description: "Review score from 1 to 5"
        tests:
          - not_null
          - accepted_values:
              values: [1, 2, 3, 4, 5]
      - name: review_comment_title
        description: "Review title written by customer"
      - name: review_comment_message
        description: "Review message written by customer"
      - name: review_creation_date
        description: "When the review was created"
        tests:
          - not_null
      - name: review_answer_timestamp
        description: "When the review was answered"

  - name: stg_sellers
    description: "Staging table for sellers - one record per seller"
    columns:
      - name: seller_id
        description: "Unique identifier for the seller"
        tests:
          - unique
          - not_null
      - name: zip_code
        description: "First 5 digits of seller zip code"
        tests:
          - not_null
      - name: city
        description: "Seller city name"
        tests:
          - not_null
      - name: state
        description: "Seller state (2-letter code)"
        tests:
          - not_null

  - name: stg_geolocation
    description: "Staging table for geolocation - deduplicated zip codes with coordinates"
    columns:
      - name: zip_code
        description: "Zip code prefix (5 digits)"
        tests:
          - unique
          - not_null
      - name: city
        description: "City name"
        tests:
          - not_null
      - name: state
        description: "State (2-letter code)"
        tests:
          - not_null
      - name: latitude
        description: "Latitude coordinate"
        tests:
          - not_null
      - name: longitude
        description: "Longitude coordinate"
        tests:
          - not_null

  - name: stg_product_translation
    description: "Staging table for product category translations from Portuguese to English"
    columns:
      - name: category_name_pt
        description: "Product category name in Portuguese"
        tests:
          - unique
          - not_null
      - name: category_name_en
        description: "Product category name in English"
        tests:
          - not_null